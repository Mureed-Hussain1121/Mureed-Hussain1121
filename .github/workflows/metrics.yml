# ═══════════════════════════════════════════════════════════════════════════════
#  GITHUB METRICS
#  Place this file at: .github/workflows/metrics.yml
#
#  What it does
#  ────────────
#  Renders a single rich SVG (isometric calendar, language breakdown, coding
#  habits, lines changed, activity) and commits it to this repo as
#  github-metrics.svg — which the README loads with a relative path.
#
#  Required secret
#  ───────────────
#  METRICS_TOKEN — a classic Personal Access Token with the `public_repo`
#  scope. Create it at github.com/settings/tokens, then add it under
#  Settings → Secrets and variables → Actions → New repository secret.
#
#  This workflow is OPTIONAL. If you skip it, delete the
#  <img src="./github-metrics.svg"> block from the README's Coding Activity
#  section, otherwise that image will render broken.
# ═══════════════════════════════════════════════════════════════════════════════

name: Generate GitHub Metrics

on:
  # Daily at 00:30 UTC.
  schedule:
    - cron: "30 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    name: Render metrics SVG
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          # ── Core ────────────────────────────────────────────────────────
          token: ${{ secrets.METRICS_TOKEN }}
          user: Mureed-Hussain1121
          filename: github-metrics.svg
          committer_branch: main
          committer_message: "chore: refresh github metrics"

          # ── Appearance (matches the README palette) ─────────────────────
          base: header, activity, community, repositories, metadata
          template: classic
          config_timezone: Asia/Karachi
          config_output: svg
          config_display: large

          # ── Isometric contribution calendar ─────────────────────────────
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # ── Language breakdown ──────────────────────────────────────────
          plugin_languages: yes
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_indepth: no

          # ── Coding habits: when and how you commit ──────────────────────
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_charts: yes
          plugin_habits_facts: yes

          # ── Lines of code changed ───────────────────────────────────────
          plugin_lines: yes
          plugin_lines_sections: base

          # ── GitHub achievements ─────────────────────────────────────────
          plugin_achievements: yes
          plugin_achievements_threshold: B
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes

          # ── Notable contributions to other repos ────────────────────────
          plugin_notable: yes
          plugin_notable_repositories: yes
